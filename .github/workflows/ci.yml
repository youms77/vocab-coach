name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: No personal data or secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse tracked data, .env, databases or audio
        run: |
          set +e
          bad=$(git ls-files | grep -P '(^|/)data/|(^|/)\.env$|(^|/)\.env\.(?!example$)|\.(db|sqlite3?|wav|webm|mp3|m4a|ogg)$')
          status=$?
          set -e
          # grep: 0 = match found, 1 = no match, 2 = error (must not pass silently)
          if [ "$status" -gt 1 ]; then echo "grep failed"; exit 2; fi
          if [ -n "$bad" ]; then
            echo "These files must not be in the public repository:"
            echo "$bad"
            exit 1
          fi
          echo "OK: nothing sensitive is tracked."

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Models and migrations agree (alembic check)
        env:
          VOCAB_DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.sqlite3
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Full demo seed (60 days) on a temporary data folder
        env:
          VOCAB_DATA_DIR: ${{ runner.temp }}/demo-data
        run: |
          uv run python -m app demo seed --anchor 2026-09-01
          uv run python -m app --demo plan today --at 2026-09-01T19:00

  frontend:
    name: Frontend (typecheck + lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    name: Windows (scripts + backend tests + frontend build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: PowerShell scripts parse without errors
        shell: pwsh
        run: |
          $files = @('start.ps1', 'scripts/check-env.ps1')
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw "Parse errors in $f" }
          }
      - name: Environment check passes (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\check-env.ps1
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run pytest
      - name: Models and migrations agree (alembic check)
        working-directory: backend
        shell: pwsh
        run: |
          $env:VOCAB_DATABASE_URL = 'sqlite:///' + ($env:RUNNER_TEMP -replace '\\', '/') + '/alembic-check.sqlite3'
          uv run alembic upgrade head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run alembic check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full demo seed (60 days) on a temporary data folder
        working-directory: backend
        shell: pwsh
        run: |
          $env:VOCAB_DATA_DIR = Join-Path $env:RUNNER_TEMP 'demo-data'
          uv run python -m app demo seed --anchor 2026-09-01
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m app --demo plan today --at 2026-09-01T19:00
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser opener script parses
        run: node --check scripts/wait-and-open.mjs
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
