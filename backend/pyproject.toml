[project]
name = "vocab-coach-backend"
version = "0.1.0"
description = "Local API for vocab-coach: turns words you care about into active vocabulary."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "fsrs>=6.3.2,<7",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# The backend is an application, not a library: no build step.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call the real provider APIs with the owner's keys: never by default, never in CI.
# Run them with `VOCAB_RUN_LIVE=1 uv run pytest tests/live -m live`.
addopts = "-q -m 'not live'"
markers = ["live: real calls to the AI providers with your own keys (needs VOCAB_RUN_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"] # assert and seeded random generators are fine in tests
