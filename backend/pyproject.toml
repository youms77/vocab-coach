[project]
name = "vocab-coach-backend"
version = "0.1.0"
description = "Local API for vocab-coach: turns words you care about into active vocabulary."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.143.2",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# The backend is an application, not a library: no build step.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is fine in tests
