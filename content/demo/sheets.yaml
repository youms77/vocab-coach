# Fictional usage sheets for the demo (milestone M4.a2, docs/DECISIONS.md D-099 and D-110).
#
# Written by hand for the demo: no excerpt from a book, an article or an AI answer.
# Each entry is saved through the sheet service as a hand-typed sheet (provider "demo") when the
# simulation creates the term.
#
#   sheet: the stored usage sheet (schema version 1, `app/domain/usage_sheet.py`). A *minimal*
#          sheet has the French translation only: the term can be discovered and its receptive
#          card is reviewed through `self_assessment` (its productive card gets the typed recall
#          that the sheet service derives from the translation).
#   exercises: present on *full* sheets only. One template of each type; the listening template
#          reuses the recognition sentence. Rules checked by backend/tests/test_demo_sheets.py
#          (the same rules as generated sheets, `app/domain/exercises.py`).
#
# Full sheets cover every term that ends queued, in triage or discovering with seed 42, and at
# least 25 learning or consolidated terms. Draft and known terms have no sheet.

dataset_version: 6

sheets:
  # --- Causal inference reading ------------------------------------------------------------
  - term: confounder
    sheet: {translation_fr: [facteur de confusion]}
  - term: omitted variable bias
    sheet: {translation_fr: [biais de variable omise]}
  - term: instrumental variable
    sheet:
      definition_simple: A variable that changes the treatment but affects the outcome only through the treatment.
      translation_fr: [variable instrumentale]
      register_level: academic
      examples:
        - {sentence: "The authors use rainfall as an instrumental variable for farm income.", kind: academic}
        - {sentence: "Honestly, finding a good instrumental variable is the hardest part of the project.", kind: spoken}
      pronunciation: {ipa_us: "ˌɪnstrəˈmɛntəl ˈvɛriəbəl", stressed_syllable: "MEN"}
      confusables:
        - {term: control variable, difference: "A control variable is added to the regression; an instrument replaces the variation of the treatment."}
    exercises:
      gap_fill: {sentence: "Lottery wins work as an ___ for household wealth in this study.", answer: instrumental variable, accepted: [instrumental variables]}
      recognition_in_sentence:
        sentence: "Without a credible instrumental variable, the causal claim is weak."
        meaning: a variable that moves the treatment and reaches the outcome only through it
        meaning_fr: une variable instrumentale
        distractors: [a variable measured with a lot of error, the main outcome of the study, a variable added only to improve the fit]
      sentence_production: {situation: "Explain to a classmate how distance to a school can help estimate the effect of schooling on wages.", example_answer: "Distance to school can serve as an instrumental variable, because it changes schooling but should not affect wages directly."}
      spoken_answer: {question: "What makes an instrument valid in a regression?", example_answer: "A valid instrumental variable is relevant for the treatment and has no direct effect on the outcome."}
  - term: rule out
    sheet: {translation_fr: [exclure, écarter]}
  - term: counterfactual
    sheet: {translation_fr: [contrefactuel]}
  - term: treatment effect
    sheet:
      definition_simple: The change in an outcome that is caused by a programme or an intervention.
      translation_fr: [effet du traitement]
      register_level: academic
      examples:
        - {sentence: "The estimated treatment effect is larger for girls than for boys.", kind: academic}
        - {sentence: "So the treatment effect is basically zero after two years, right?", kind: spoken}
      pronunciation: {ipa_us: "ˈtritmənt ɪˈfɛkt", stressed_syllable: "TREAT"}
      french_speaker_pitfalls:
        - {wrong: "treatment affect", right: "treatment effect", explanation: "'Effect' is the noun; 'affect' is usually the verb."}
    exercises:
      gap_fill: {sentence: "The average ___ of the tutoring programme was about a tenth of a standard deviation.", answer: treatment effect, accepted: [treatment effects]}
      recognition_in_sentence:
        sentence: "The treatment effect disappears once we control for prior grades."
        meaning: the change in the outcome caused by the intervention
        meaning_fr: l'effet causé par l'intervention
        distractors: [the side effects of a medicine, the cost of running the programme, the number of people who received the programme]
      sentence_production: {situation: "Write one sentence reporting that a cash transfer raised school attendance by five points.", example_answer: "The cash transfer had a treatment effect of five percentage points on school attendance."}
      spoken_answer: {question: "How would you describe the main result of a randomised trial to your supervisor?", example_answer: "The treatment effect is positive and significant, about three points on the test."}
  - term: selection bias
    sheet:
      definition_simple: A bias that appears when the people compared were not chosen at random.
      translation_fr: [biais de sélection]
      register_level: academic
      examples:
        - {sentence: "Comparing volunteers with non-volunteers introduces selection bias.", kind: academic}
        - {sentence: "I think there's some selection bias here, only motivated people answered.", kind: spoken}
      pronunciation: {ipa_us: "sɪˈlɛkʃən ˈbaɪəs", stressed_syllable: "LEC"}
      confusables:
        - {term: sampling error, difference: "Sampling error is random noise; selection bias is a systematic distortion."}
    exercises:
      gap_fill: {sentence: "Because only successful firms reported their data, the sample suffers from ___.", answer: selection bias}
      recognition_in_sentence:
        sentence: "Random assignment protects the trial against selection bias."
        meaning: a distortion caused by how the compared groups were formed
        meaning_fr: un biais lié à la façon dont les groupes ont été formés
        distractors: [an error in the computer code, a preference of the researcher for one result, a lack of statistical power]
      sentence_production: {situation: "Warn a classmate that students who chose online classes may differ from the others.", example_answer: "Be careful, comparing students who chose online classes with the rest may suffer from selection bias."}
      spoken_answer: {question: "Why can't we simply compare people who joined a training programme with those who didn't?", example_answer: "Because of selection bias: the people who joined were probably more motivated in the first place."}
  - term: identification strategy
    sheet: {translation_fr: [stratégie d'identification]}
  - term: robustness check
    sheet: {translation_fr: [test de robustesse]}
  - term: parallel trends assumption
    sheet: {translation_fr: [hypothèse de tendances parallèles]}
  - term: spillover
    sheet:
      definition_simple: An effect of a programme on people or places that did not receive it.
      translation_fr: [effet de débordement, retombée]
      examples:
        - {sentence: "Spillovers to neighbouring schools would bias the estimate towards zero.", kind: academic}
        - {sentence: "There's probably a spillover, kids talk to their friends in other classes.", kind: spoken}
      pronunciation: {ipa_us: "ˈspɪlˌoʊvər", stressed_syllable: "SPILL"}
    exercises:
      gap_fill: {sentence: "Farmers in control villages copied the new technique, a clear ___ from the treated villages.", answer: spillover, accepted: [spillovers]}
      recognition_in_sentence:
        sentence: "The design leaves a buffer zone to limit spillovers between groups."
        meaning: an effect that reaches people who were not treated
        meaning_fr: un effet qui atteint des personnes non traitées
        distractors: [a liquid that falls out of a container, money left over at the end of a project, a delay in data collection]
      sentence_production: {situation: "Explain why treated and untreated students in the same school may not be a clean comparison.", example_answer: "Students in the same school share ideas, so there may be a spillover from treated to untreated students."}
      spoken_answer: {question: "Why do some trials randomise whole villages rather than individuals?", example_answer: "To avoid spillovers: neighbours in the same village would otherwise affect each other."}
  - term: attrition
    sheet:
      definition_simple: The loss of participants from a study over time.
      translation_fr: [attrition, perte de participants]
      register_level: academic
      examples:
        - {sentence: "Attrition reached twenty percent by the third survey wave.", kind: academic}
        - {sentence: "We lost a lot of people between rounds, attrition was really bad.", kind: spoken}
      pronunciation: {ipa_us: "əˈtrɪʃən", stressed_syllable: "TRI"}
      french_speaker_pitfalls:
        - {wrong: "the attritions", right: "attrition", explanation: "In this sense 'attrition' is usually uncountable."}
    exercises:
      gap_fill: {sentence: "Differential ___ between the two arms can break the randomisation.", answer: attrition}
      recognition_in_sentence:
        sentence: "Attrition was concentrated among the poorest households."
        meaning: participants dropping out of the study
        meaning_fr: des participants qui quittent l'étude
        distractors: [a slow increase in prices, a disagreement between referees, a missing variable in the data]
      sentence_production: {situation: "Report that many respondents could not be found for the follow-up survey.", example_answer: "Attrition was high, since many respondents could not be found for the follow-up survey."}
      spoken_answer: {question: "What problem appears when participants leave a panel study?", example_answer: "Attrition, and if the people who leave are different, the results become biased."}
  - term: plausibly exogenous
    sheet: {translation_fr: [vraisemblablement exogène]}
  - term: shed light on
    sheet:
      definition_simple: To help explain something or make it easier to understand.
      translation_fr: [éclairer, faire la lumière sur]
      register_level: academic
      examples:
        - {sentence: "These interviews shed light on why so few farmers adopted the seeds.", kind: academic}
        - {sentence: "Maybe the qualitative data can shed light on that weird result.", kind: spoken}
      pronunciation: {ipa_us: "ʃɛd ˈlaɪt ɑn", stressed_syllable: "LIGHT"}
      french_speaker_pitfalls:
        - {wrong: "shed light about", right: "shed light on", explanation: "The preposition is always 'on'."}
    exercises:
      gap_fill: {sentence: "The survey may ___ the reasons behind the drop in enrolment.", answer: shed light on, accepted: [sheds light on]}
      recognition_in_sentence:
        sentence: "Administrative records shed light on the timing of the reform."
        meaning: help to explain or clarify
        meaning_fr: aider à comprendre, éclairer
        distractors: [hide or make less visible, turn on the lights in a room, reduce the cost of]
      sentence_production: {situation: "Say that your new dataset helps explain how families choose schools.", example_answer: "Our new dataset sheds light on how families choose schools."}
      spoken_answer: {question: "Why did you add interviews to your quantitative study?", example_answer: "Because the interviews shed light on the mechanisms behind the numbers."}
  - term: hold constant
    sheet:
      definition_simple: To keep a factor fixed so that its effect does not change the comparison.
      translation_fr: [maintenir constant, contrôler]
      register_level: academic
      examples:
        - {sentence: "The model estimates the effect of age while it holds constant education and income.", kind: academic}
        - {sentence: "If we hold constant the region, the gap almost disappears.", kind: spoken}
      pronunciation: {ipa_us: "hoʊld ˈkɑnstənt", stressed_syllable: "CON"}
    exercises:
      gap_fill: {sentence: "The regression tries to ___ every factor except class size.", answer: hold constant}
      recognition_in_sentence:
        sentence: "Holding constant parental income, the effect of school type is small."
        meaning: keeping a factor fixed in the comparison
        meaning_fr: en maintenant un facteur fixe
        distractors: [measuring a factor more often, ignoring a factor completely, increasing a factor step by step]
      sentence_production: {situation: "Explain that you compared wages of people with the same experience.", example_answer: "We hold constant experience, so the wage comparison is between similar workers."}
      spoken_answer: {question: "What does a control variable do in a regression?", example_answer: "It lets us hold constant one factor while we look at the effect of another."}
  - term: drive the results
    sheet: {translation_fr: [déterminer les résultats, être à l'origine des résultats]}
  - term: hinge on
    sheet:
      definition_simple: To depend completely on something.
      translation_fr: [dépendre entièrement de, reposer sur]
      examples:
        - {sentence: "The validity of the design hinges on the timing of the policy.", kind: academic}
        - {sentence: "Well, it all hinges on whether the data arrive this month.", kind: spoken}
      pronunciation: {ipa_us: "ˈhɪndʒ ɑn", stressed_syllable: "HINGE"}
      french_speaker_pitfalls:
        - {wrong: "hinge of", right: "hinge on", explanation: "The verb takes 'on' (or 'upon'), never 'of'."}
    exercises:
      gap_fill: {sentence: "Our conclusion would ___ a single outlier, which is not reassuring.", answer: hinge on, accepted: [hinges on]}
      recognition_in_sentence:
        sentence: "The whole estimate hinges on the exclusion restriction."
        meaning: depends completely on
        meaning_fr: dépend entièrement de
        distractors: [is opposed to, is written next to, is less important than]
      sentence_production: {situation: "Say that the success of your project depends entirely on access to tax records.", example_answer: "The success of the project hinges on access to tax records."}
      spoken_answer: {question: "What is the weak point of your identification?", example_answer: "It hinges on the assumption that the two regions followed parallel trends."}
  - term: caveat
    sheet:
      definition_simple: A warning that a statement or result has a limit.
      translation_fr: [réserve, mise en garde]
      examples:
        - {sentence: "An important caveat is that the sample excludes informal workers.", kind: academic}
        - {sentence: "Just one caveat before I show the chart: the last month is incomplete.", kind: spoken}
      pronunciation: {ipa_us: "ˈkæviˌæt", stressed_syllable: "CAV"}
      confusables:
        - {term: limitation, difference: "A limitation is a weakness of the study; a caveat is the warning you give about it."}
    exercises:
      gap_fill: {sentence: "With the ___ that prices are self-reported, the trend looks clear.", answer: caveat, accepted: [caveats]}
      recognition_in_sentence:
        sentence: "The report adds a caveat about the small number of rural schools."
        meaning: a warning about a limit of the result
        meaning_fr: une mise en garde, une réserve
        distractors: [a summary of the main findings, a list of references, a thank-you note to the funders]
      sentence_production: {situation: "Before presenting your result, warn the audience that it covers only one city.", example_answer: "One caveat: these results cover only one city."}
      spoken_answer: {question: "Is your result valid for the whole country?", example_answer: "With a caveat: the survey only covers urban areas, so I would be careful."}
  - term: to a large extent
    sheet: {translation_fr: [dans une large mesure]}
  - term: bear out
    sheet:
      definition_simple: To show that something is true.
      translation_fr: [confirmer, corroborer]
      register_level: academic
      examples:
        - {sentence: "The new data bear out the earlier estimates.", kind: academic}
        - {sentence: "I hope the second survey will bear out what we saw in the first one.", kind: spoken}
      pronunciation: {ipa_us: "bɛr ˈaʊt", stressed_syllable: "OUT"}
      french_speaker_pitfalls:
        - {wrong: "bear the results", right: "bear out the results", explanation: "Without 'out' the verb means 'carry' or 'tolerate'."}
    exercises:
      gap_fill: {sentence: "Later studies did not ___ the claim that homework improves grades.", answer: bear out, accepted: [bears out, bore out, borne out]}
      recognition_in_sentence:
        sentence: "The field visits bear out the patterns in the survey."
        meaning: confirm, show to be true
        meaning_fr: confirmer
        distractors: [contradict, carry outside, make more complicated]
      sentence_production: {situation: "Say that the second experiment confirms the result of the first.", example_answer: "The second experiment bears out the result of the first."}
      spoken_answer: {question: "Did the follow-up data support your hypothesis?", example_answer: "Yes, the follow-up data bear out the hypothesis quite clearly."}
  - term: back-of-the-envelope
    sheet: {translation_fr: [approximatif, fait sur un coin de table]}
  - term: cherry-pick
    sheet: {translation_fr: [sélectionner à sa convenance, trier sur le volet]}
  - term: tease out
    sheet:
      definition_simple: To separate one effect or piece of information from others with effort.
      translation_fr: [démêler, isoler]
      examples:
        - {sentence: "The design helps tease out the effect of price from the effect of quality.", kind: academic}
        - {sentence: "It's tricky to tease out what's really going on here.", kind: spoken}
      pronunciation: {ipa_us: "tiz ˈaʊt", stressed_syllable: "OUT"}
    exercises:
      gap_fill: {sentence: "We need more variation to ___ the role of peers.", answer: tease out}
      recognition_in_sentence:
        sentence: "Panel data let us tease out short-term and long-term effects."
        meaning: separate and identify with effort
        meaning_fr: démêler, isoler
        distractors: [make fun of, publish quickly, remove from the sample]
      sentence_production: {situation: "Say that it is hard to separate the effect of the teacher from the effect of the school.", example_answer: "It is hard to tease out the effect of the teacher from the effect of the school."}
      spoken_answer: {question: "Why did you collect data on both parents?", example_answer: "To tease out the role of the mother's education from the father's."}
  - term: noisy estimate
    sheet: {translation_fr: [estimation bruitée, estimation imprécise]}
  - term: take into account
    sheet:
      definition_simple: To consider something when you make a decision or a calculation.
      translation_fr: [prendre en compte]
      examples:
        - {sentence: "The weights take into account the unequal probability of selection.", kind: academic}
        - {sentence: "Did you take into account the holidays when you counted the days?", kind: spoken}
      pronunciation: {ipa_us: "teɪk ˈɪntu əˈkaʊnt", stressed_syllable: "COUNT"}
      french_speaker_pitfalls:
        - {wrong: "take in account", right: "take into account", explanation: "The preposition is 'into', not 'in'."}
    exercises:
      gap_fill: {sentence: "The forecast does not ___ the new tax rules.", answer: take into account, accepted: [takes into account, took into account]}
      recognition_in_sentence:
        sentence: "The final grade takes into account attendance as well as exams."
        meaning: considers, includes in the calculation
        meaning_fr: prend en compte
        distractors: [opens a bank account, ignores on purpose, pays back]
      sentence_production: {situation: "Tell your supervisor that your model now includes seasonal effects.", example_answer: "The model now takes into account seasonal effects."}
      spoken_answer: {question: "How did you deal with inflation in your comparison of wages?", example_answer: "I took into account inflation by using real wages."}
  - term: underpowered
    sheet: {translation_fr: [de puissance insuffisante]}
  - term: run a regression
    sheet: {translation_fr: [faire une régression, estimer une régression]}
  - term: point estimate
    sheet: {translation_fr: [estimation ponctuelle]}
  - term: downward biased
    sheet: {translation_fr: [biaisé vers le bas, sous-estimé]}
  - term: overstate
    sheet:
      definition_simple: To describe something as larger or more important than it really is.
      translation_fr: [surestimer, exagérer]
      examples:
        - {sentence: "Survey answers tend to overstate the time spent on homework.", kind: academic}
        - {sentence: "I don't want to overstate it, but the effect is pretty big.", kind: spoken}
      pronunciation: {ipa_us: "ˌoʊvərˈsteɪt", stressed_syllable: "STATE"}
      confusables:
        - {term: overestimate, difference: "'Overestimate' is about a number or a guess; 'overstate' is about how something is described."}
    exercises:
      gap_fill: {sentence: "Press releases often ___ the importance of a single study.", answer: overstate, accepted: [overstates, overstated]}
      recognition_in_sentence:
        sentence: "Self-reported income may overstate real earnings."
        meaning: present as bigger than it really is
        meaning_fr: exagérer, surestimer
        distractors: [state again in other words, understate, explain in great detail]
      sentence_production: {situation: "Warn a journalist not to present your small result as a revolution.", example_answer: "Please don't overstate the result: it is a small effect in one region."}
      spoken_answer: {question: "Are the effects in your paper as large as the headline suggests?", example_answer: "No, the headline overstates them quite a lot."}

  # --- Campus life -----------------------------------------------------------------------------
  - term: on campus
    sheet: {translation_fr: [sur le campus]}
  - term: dorm
    sheet: {translation_fr: [résidence universitaire]}
  - term: office hours
    sheet: {translation_fr: [permanence (d'un enseignant)]}
  - term: hand in
    sheet:
      definition_simple: To give a piece of work to a teacher or an office.
      translation_fr: [rendre, remettre]
      register_level: neutral
      examples:
        - {sentence: "Candidates must hand in the final version of the thesis by the end of June.", kind: academic}
        - {sentence: "Did you hand in the problem set already?", kind: spoken}
      pronunciation: {ipa_us: "hænd ˈɪn", stressed_syllable: "IN"}
      confusables:
        - {term: hand out, difference: "You hand out documents to people; you hand in your own work."}
    exercises:
      gap_fill: {sentence: "Remember to ___ your lab report before the weekend.", answer: hand in, accepted: [hands in, handed in]}
      recognition_in_sentence:
        sentence: "Half the class handed in the essay late."
        meaning: gave their work to the teacher
        meaning_fr: ont rendu leur travail
        distractors: [wrote by hand, distributed to everyone, refused to do]
      sentence_production: {situation: "Ask your tutor when the essay must be given to the secretary's office.", example_answer: "When do we have to hand in the essay to the secretary's office?"}
      spoken_answer: {question: "What did you do just before the deadline last night?", example_answer: "I finished my report and handed in the file at eleven fifty."}
  - term: sign up for
    sheet:
      definition_simple: To put your name on a list to take part in something.
      translation_fr: [s'inscrire à]
      examples:
        - {sentence: "Students who sign up for the methods course receive a reading list in advance.", kind: academic}
        - {sentence: "I'm going to sign up for the coding workshop, want to come?", kind: spoken}
      pronunciation: {ipa_us: "saɪn ˈʌp fɔr", stressed_syllable: "UP"}
      french_speaker_pitfalls:
        - {wrong: "inscribe to a course", right: "sign up for a course", explanation: "'Inscribe' means engrave; use 'sign up for' or 'enrol in'."}
    exercises:
      gap_fill: {sentence: "You can ___ the summer school until the end of May.", answer: sign up for, accepted: [signed up for, signs up for]}
      recognition_in_sentence:
        sentence: "Forty students signed up for the evening seminar."
        meaning: registered to take part in
        meaning_fr: se sont inscrits à
        distractors: [signed a contract against, cancelled their place in, wrote a review of]
      sentence_production: {situation: "Tell a friend you registered for the football tournament.", example_answer: "I signed up for the football tournament this morning."}
      spoken_answer: {question: "What activities are you doing this term besides your classes?", example_answer: "I signed up for the debate club and a Spanish class."}
  - term: catch up on
    sheet: {translation_fr: [rattraper (son retard sur)]}
  - term: run late
    sheet:
      definition_simple: To be later than planned.
      translation_fr: [être en retard, prendre du retard]
      register_level: spoken
      examples:
        - {sentence: "Projects that run late are often the ones that were planned too optimistically.", kind: academic}
        - {sentence: "Sorry, I'm going to run late, start without me.", kind: spoken}
      pronunciation: {ipa_us: "rʌn ˈleɪt", stressed_syllable: "LATE"}
      french_speaker_pitfalls:
        - {wrong: "I am in late", right: "I'm running late", explanation: "Use 'run late' or 'be late'; 'in late' is not used this way."}
    exercises:
      gap_fill: {sentence: "The morning lecture tends to ___ when there are many questions.", answer: run late, accepted: [running late, ran late, runs late]}
      recognition_in_sentence:
        sentence: "The bus is running late again, so I'll walk."
        meaning: being later than planned
        meaning_fr: être en retard
        distractors: [running very fast, leaving earlier than planned, being cancelled]
      sentence_production: {situation: "Send a short message to your study partner: you will arrive ten minutes after the agreed time.", example_answer: "I'm running late, I'll be there in ten minutes."}
      spoken_answer: {question: "Why did the meeting finish after six yesterday?", example_answer: "Because the first speaker ran late and everything was pushed back."}
  - term: get the hang of
    sheet:
      definition_simple: To learn how to do something after some practice.
      translation_fr: [prendre le coup de main pour]
      register_level: spoken
      examples:
        - {sentence: "Most participants get the hang of the interface after two practice rounds.", kind: academic}
        - {sentence: "Don't worry, you'll get the hang of it in a few days.", kind: spoken}
      pronunciation: {ipa_us: "ɡɛt ðə ˈhæŋ əv", stressed_syllable: "HANG"}
    exercises:
      gap_fill: {sentence: "It took me a while to ___ the new statistics package.", answer: get the hang of, accepted: [getting the hang of, got the hang of]}
      recognition_in_sentence:
        sentence: "I'm finally getting the hang of writing proofs."
        meaning: learning how to do it with practice
        meaning_fr: prendre le coup de main
        distractors: [giving up on, being afraid of, teaching someone else]
      sentence_production: {situation: "Tell your flatmate that cooking rice is becoming easy for you after a few tries.", example_answer: "I'm getting the hang of cooking rice now."}
      spoken_answer: {question: "How is your new part-time job going?", example_answer: "It was hard at first, but I'm getting the hang of it."}
  - term: flatmate
    sheet:
      definition_simple: A person who shares a flat with you.
      translation_fr: [colocataire]
      register_level: neutral
      examples:
        - {sentence: "Respondents living with a flatmate reported lower rent burdens.", kind: academic}
        - {sentence: "My flatmate is cooking tonight, so I'm free.", kind: spoken}
      pronunciation: {ipa_us: "ˈflætˌmeɪt", stressed_syllable: "FLAT"}
      confusables:
        - {term: roommate, difference: "'Roommate' is the usual American word; British English prefers 'flatmate' for a shared flat."}
    exercises:
      gap_fill: {sentence: "My ___ borrowed my laptop charger again.", answer: flatmate, accepted: [flatmates]}
      recognition_in_sentence:
        sentence: "Her flatmate works nights, so the kitchen is quiet in the evening."
        meaning: a person she shares her flat with
        meaning_fr: sa colocataire
        distractors: [her classmate, her landlord, her neighbour across the street]
      sentence_production: {situation: "Explain who Tom is: he lives in the same flat as you.", example_answer: "Tom is my flatmate, we share the flat near the station."}
      spoken_answer: {question: "Do you live alone this year?", example_answer: "No, I live with two flatmates from my course."}
  - term: grab a coffee
    sheet:
      definition_simple: To have a quick coffee, often with someone.
      translation_fr: [prendre un café (rapidement)]
      register_level: informal
      examples:
        - {sentence: "Informal meetings, such as when colleagues grab a coffee, support knowledge sharing.", kind: academic}
        - {sentence: "Want to grab a coffee after the lecture?", kind: spoken}
