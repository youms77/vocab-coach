  # --- Thesis defence --------------------------------------------------------------------------
  - term: trade-off
    sheet:
      definition_simple: A balance between two things you cannot have fully at the same time.
      translation_fr: [compromis, arbitrage]
      examples:
        - {sentence: "The choice of bandwidth involves a trade-off between bias and variance.", kind: academic}
        - {sentence: "It's a trade-off: faster code, but harder to read.", kind: spoken}
      pronunciation: {ipa_us: "ˈtreɪdˌɔf", stressed_syllable: "TRADE"}
      confusables:
        - {term: compromise, difference: "A compromise is an agreement between people; a trade-off is a balance between two goals."}
    exercises:
      gap_fill: {sentence: "There is a clear ___ between sample size and survey cost.", answer: trade-off, accepted: [trade-offs]}
      recognition_in_sentence:
        sentence: "Every design choice in the survey was a trade-off."
        meaning: a balance between two goals that compete
        meaning_fr: un compromis, un arbitrage
        distractors: [a mistake, a shared decision by vote, a legal agreement]
      sentence_production: {situation: "Explain that a bigger model is more accurate but slower.", example_answer: "There is a trade-off: the bigger model is more accurate but much slower."}
      spoken_answer: {question: "Why didn't you collect more variables in your survey?", example_answer: "It was a trade-off between detail and the response rate."}
  - term: contribution to the literature
    sheet:
      definition_simple: What a study adds to existing research on a topic.
      translation_fr: [contribution à la littérature]
      register_level: academic
      examples:
        - {sentence: "The main contribution to the literature is a new measure of school quality.", kind: academic}
        - {sentence: "So what's your contribution to the literature, in one sentence?", kind: spoken}
      pronunciation: {ipa_us: "ˌkɑntrəˈbjuʃən tu ðə ˈlɪtərətʃər", stressed_syllable: "BU"}
      french_speaker_pitfalls:
        - {wrong: "contribution at the literature", right: "contribution to the literature", explanation: "The noun takes 'to'."}
    exercises:
      gap_fill: {sentence: "This chapter makes a ___ by using administrative data.", answer: contribution to the literature}
      recognition_in_sentence:
        sentence: "Her second contribution to the literature is methodological."
        meaning: what her research adds to existing studies
        meaning_fr: son apport à la recherche existante
        distractors: [a donation to the library, a list of the books she read, a review of a novel]
      sentence_production: {situation: "State in your introduction what your thesis adds to research on mobile money.", example_answer: "My contribution to the literature is new evidence on mobile money and savings."}
      spoken_answer: {question: "What is new in your thesis compared to earlier work?", example_answer: "The main contribution to the literature is the use of a natural experiment."}
  - term: limitation
    sheet:
      definition_simple: A weakness or a point that reduces how far a result can be trusted or used.
      translation_fr: [limite]
      register_level: academic
      examples:
        - {sentence: "One limitation of the study is the short follow-up period.", kind: academic}
        - {sentence: "The obvious limitation is the sample size, I know.", kind: spoken}
      pronunciation: {ipa_us: "ˌlɪmɪˈteɪʃən", stressed_syllable: "TA"}
      french_speaker_pitfalls:
        - {wrong: "a limit of the study", right: "a limitation of the study", explanation: "For research weaknesses, English says 'limitation'."}
    exercises:
      gap_fill: {sentence: "The jury asked about the main ___ of my design.", answer: limitation, accepted: [limitations]}
      recognition_in_sentence:
        sentence: "The authors discuss each limitation in a separate section."
        meaning: weakness of the study
        meaning_fr: limite de l'étude
        distractors: [speed restriction, final conclusion, list of sources]
      sentence_production: {situation: "Admit during your defence that your data come from one region only.", example_answer: "A limitation of my thesis is that the data come from one region only."}
      spoken_answer: {question: "What would you do differently with more time?", example_answer: "I would address the main limitation, which is the lack of panel data."}
  - term: address a concern
    sheet: {translation_fr: [répondre à une préoccupation]}
  - term: build on
    sheet:
      definition_simple: To use earlier work as a base for new work.
      translation_fr: [s'appuyer sur, prolonger]
      register_level: academic
      examples:
        - {sentence: "This paper builds on recent work on teacher incentives.", kind: academic}
        - {sentence: "We could build on what the last cohort did.", kind: spoken}
      pronunciation: {ipa_us: "bɪld ɑn", stressed_syllable: "BUILD"}
    exercises:
      gap_fill: {sentence: "The second chapter will ___ the model of the first one.", answer: build on, accepted: [builds on, built on]}
      recognition_in_sentence:
        sentence: "Our method builds on an earlier matching approach."
        meaning: uses as a starting point
        meaning_fr: s'appuie sur
        distractors: [rejects completely, copies exactly, destroys]
      sentence_production: {situation: "Explain that your project extends the survey designed by your supervisor.", example_answer: "My project builds on the survey my supervisor designed."}
      spoken_answer: {question: "How does your thesis relate to previous studies?", example_answer: "It builds on two earlier studies and adds new data."}
  - term: set out to
    sheet: {translation_fr: [se proposer de, entreprendre de]}
  - term: fall short of
    sheet: {translation_fr: [être en deçà de, ne pas atteindre]}
  - term: in line with
    sheet: {translation_fr: [conforme à, en accord avec]}
  - term: further research
    sheet: {translation_fr: [recherches futures, travaux complémentaires]}

