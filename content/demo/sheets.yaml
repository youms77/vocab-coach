    sheet: {translation_fr: [jeu de données déséquilibré]}
  - term: edge case
    sheet: {translation_fr: [cas limite]}
  - term: scale up
    sheet: {translation_fr: [passer à l'échelle, augmenter l'échelle]}
  - term: deploy a model
    sheet: {translation_fr: [déployer un modèle]}
  - term: off the top of my head
    sheet:
      definition_simple: Without checking or thinking carefully; from memory.
      translation_fr: [comme ça, de tête, sans vérifier]
      register_level: spoken
      examples:
        - {sentence: "Off the top of my head, the closest study is an older field experiment on fertiliser.", kind: academic}
        - {sentence: "Off the top of my head, the dataset had about two million rows.", kind: spoken}
      pronunciation: {ipa_us: "ɔf ðə ˈtɑp əv maɪ ˈhɛd", stressed_syllable: "TOP"}
    exercises:
      gap_fill: {sentence: "I don't remember the exact score, but ___ it was around ninety percent.", answer: off the top of my head}
      recognition_in_sentence:
        sentence: "Off the top of my head, I'd say the project took three months."
        meaning: without checking, from memory
        meaning_fr: de tête, sans vérifier
        distractors: [after careful calculation, according to my manager, at the highest level]
      sentence_production: {situation: "An interviewer asks how many users your app had; give a rough number without checking.", example_answer: "Off the top of my head, around five thousand users."}
      spoken_answer: {question: "How long did training your best model take?", example_answer: "Off the top of my head, about six hours on one GPU."}
  - term: that's a great question
    sheet: {translation_fr: [c'est une excellente question]}
  - term: drill down into
    sheet:
      definition_simple: To look at something in more and more detail.
      translation_fr: [examiner en détail, creuser]
      examples:
        - {sentence: "The dashboard lets analysts drill down into results by region.", kind: academic}
        - {sentence: "Can we drill down into the drop in March?", kind: spoken}
      pronunciation: {ipa_us: "drɪl ˈdaʊn ˈɪntu", stressed_syllable: "DOWN"}
    exercises:
      gap_fill: {sentence: "Let me ___ the errors for the smallest class.", answer: drill down into}
      recognition_in_sentence:
        sentence: "We drilled down into the logs to find the failing requests."
        meaning: looked at in more detail
        meaning_fr: avons examiné en détail
        distractors: [deleted, summarised quickly, copied to another server]
      sentence_production: {situation: "Suggest to your team that you examine customer churn by age group in detail.", example_answer: "Let's drill down into churn by age group."}
      spoken_answer: {question: "Your overall accuracy is good. What would you check next?", example_answer: "I would drill down into the errors for each class to find weak spots."}
  - term: roll out
    sheet:
      definition_simple: To introduce a new product or system, often step by step.
      translation_fr: [déployer progressivement, lancer]
      examples:
        - {sentence: "The reform was rolled out in three regions before the national launch.", kind: academic}
        - {sentence: "We'll roll out the new version on Monday.", kind: spoken}
      pronunciation: {ipa_us: "roʊl ˈaʊt", stressed_syllable: "OUT"}
    exercises:
      gap_fill: {sentence: "The company plans to ___ the feature to all users next month.", answer: roll out, accepted: [rolled out, rolls out]}
      recognition_in_sentence:
        sentence: "They rolled out the model to a small group of customers first."
        meaning: introduced it gradually
        meaning_fr: l'ont déployé progressivement
        distractors: [removed it, trained it again, sold it]
      sentence_production: {situation: "Explain that the new recommendation system will reach users in stages.", example_answer: "We will roll out the recommendation system in stages."}
      spoken_answer: {question: "How did you reduce the risk when you launched your model?", example_answer: "We rolled out the model to ten percent of traffic first."}
  - term: interpretable
    sheet:
      definition_simple: Easy for people to understand and explain.
      translation_fr: [interprétable]
      examples:
        - {sentence: "Interpretable models are preferred in credit scoring.", kind: academic}
        - {sentence: "The tree is less accurate but way more interpretable.", kind: spoken}
      pronunciation: {ipa_us: "ɪnˈtɜrprətəbəl", stressed_syllable: "TER"}
    exercises:
      gap_fill: {sentence: "Doctors want a model that is accurate and ___.", answer: interpretable}
      recognition_in_sentence:
        sentence: "A linear model is interpretable, so we can explain each coefficient."
        meaning: easy to understand and explain
        meaning_fr: interprétable
        distractors: [very fast to train, impossible to change, translated into many languages]
      sentence_production: {situation: "Explain why a bank prefers a simple scoring model to a deep neural network.", example_answer: "The bank prefers a simple model because it is interpretable."}
      spoken_answer: {question: "Why would you choose logistic regression over a black box?", example_answer: "Because it is interpretable and the stakeholders can trust it."}
  - term: tweak
    sheet:
      definition_simple: To make a small change to something in order to improve it.
      translation_fr: [ajuster légèrement, peaufiner]
      register_level: neutral
      examples:
        - {sentence: "We tweaked the learning rate and the validation error dropped.", kind: academic}
        - {sentence: "I just need to tweak the last slide before the meeting.", kind: spoken}
      pronunciation: {ipa_us: "twik", stressed_syllable: "TWEAK"}
      confusables:
        - {term: twist, difference: "To twist is to turn or bend something; to tweak is to adjust it a little."}
    exercises:
      gap_fill: {sentence: "After the first run we had to ___ the model slightly.", answer: tweak, accepted: [tweaked, tweaks, tweaking]}
      recognition_in_sentence:
        sentence: "She tweaked the figure so that the labels were easier to read."
        meaning: made a small change to improve something
        meaning_fr: ajusté légèrement
        distractors: [deleted completely, copied without changes, printed on paper]
      sentence_production: {situation: "Tell a colleague that you changed a small detail in your code to fix a bug.", example_answer: "I tweaked one parameter in the code and the bug disappeared."}
      spoken_answer: {question: "Which small change did you make to improve your last project?", example_answer: "I tweaked the model to reduce the error on the test set."}
  - term: sanity check
    sheet:
      definition_simple: A quick test to see if a result makes basic sense.
      translation_fr: [vérification de cohérence]
      register_level: spoken
      examples:
        - {sentence: "A sanity check against official statistics confirmed the totals.", kind: academic}
        - {sentence: "Let me do a quick sanity check before I send it.", kind: spoken}
      pronunciation: {ipa_us: "ˈsænəti tʃɛk", stressed_syllable: "SAN"}
    exercises:
      gap_fill: {sentence: "Comparing the totals with last year is a good ___.", answer: sanity check, accepted: [sanity checks]}
      recognition_in_sentence:
        sentence: "The sanity check showed that some ages were negative."
        meaning: a quick test that the result makes sense
        meaning_fr: une vérification de cohérence
        distractors: [a medical test, a full audit of the company, a payment made by cheque]
      sentence_production: {situation: "Tell your colleague you quickly verified that the predictions are between zero and one.", example_answer: "As a sanity check, I verified that all predictions are between zero and one."}
      spoken_answer: {question: "How do you know your data pipeline works?", example_answer: "I run a sanity check on the row counts after each step."}
  - term: bottleneck
    sheet:
      definition_simple: The part of a process that slows down everything else.
      translation_fr: [goulot d'étranglement]
      examples:
        - {sentence: "Manual labelling remains the main bottleneck in the annotation pipeline.", kind: academic}
        - {sentence: "The database is the bottleneck, not the model.", kind: spoken}
      pronunciation: {ipa_us: "ˈbɑtəlˌnɛk", stressed_syllable: "BOT"}
    exercises:
      gap_fill: {sentence: "Reading the files from disk was the real ___.", answer: bottleneck, accepted: [bottlenecks]}
      recognition_in_sentence:
        sentence: "We found the bottleneck in the data loading step."
        meaning: the step that slows everything down
        meaning_fr: le goulot d'étranglement
        distractors: [the most expensive server, a bug that crashes the program, the final report]
      sentence_production: {situation: "Explain that your training is slow because images are resized one by one.", example_answer: "The bottleneck is resizing images one by one."}
      spoken_answer: {question: "How did you make your pipeline faster?", example_answer: "I profiled it, found the bottleneck in the joins and rewrote them."}
  - term: stakeholder
    sheet:
      definition_simple: A person or group with an interest in a project or its results.
      translation_fr: [partie prenante]
      examples:
        - {sentence: "Stakeholders were consulted before the indicators were chosen.", kind: academic}
        - {sentence: "I had to explain the results to stakeholders with no stats background.", kind: spoken}
      pronunciation: {ipa_us: "ˈsteɪkˌhoʊldər", stressed_syllable: "STAKE"}
    exercises:
      gap_fill: {sentence: "Every ___ received a short summary of the findings.", answer: stakeholder, accepted: [stakeholders]}
      recognition_in_sentence:
        sentence: "The main stakeholder in this project is the marketing team."
        meaning: a group with an interest in the project
        meaning_fr: la partie prenante
        distractors: [the person who writes the code, the company's lawyer, an external competitor]
      sentence_production: {situation: "Explain that you presented your dashboard to the managers who will use it.", example_answer: "I presented the dashboard to the stakeholders who will use it."}
      spoken_answer: {question: "How do you communicate technical results?", example_answer: "I adapt the message to each stakeholder and avoid jargon."}
  - term: outperform
    sheet:
      definition_simple: To do better than someone or something else.
      translation_fr: [surpasser, faire mieux que]
      examples:
        - {sentence: "Gradient boosting outperformed linear models on every dataset.", kind: academic}
        - {sentence: "Honestly, the simple model outperforms the fancy one.", kind: spoken}
      pronunciation: {ipa_us: "ˌaʊtpərˈfɔrm", stressed_syllable: "FORM"}
      french_speaker_pitfalls:
        - {wrong: "outperform on the baseline", right: "outperform the baseline", explanation: "The verb takes a direct object, with no preposition."}
    exercises:
      gap_fill: {sentence: "Our new features helped the model ___ the baseline by four points.", answer: outperform, accepted: [outperformed, outperforms]}
      recognition_in_sentence:
        sentence: "The small model outperforms the large one on short texts."
        meaning: does better than
        meaning_fr: fait mieux que
        distractors: [performs on stage with, is slower than, is copied from]
      sentence_production: {situation: "Report that your random forest gave better results than the logistic regression.", example_answer: "The random forest outperformed the logistic regression."}
      spoken_answer: {question: "Which model did you finally choose, and why?", example_answer: "The gradient boosting model, because it outperformed the others on recall."}
  - term: in hindsight
    sheet:
      definition_simple: When you think about a past event with what you know now.
      translation_fr: [avec le recul]
      examples:
        - {sentence: "In hindsight, the sampling frame excluded too many rural households.", kind: academic}
        - {sentence: "In hindsight, I should have tested it on real data first.", kind: spoken}
      pronunciation: {ipa_us: "ɪn ˈhaɪndˌsaɪt", stressed_syllable: "HIND"}
      french_speaker_pitfalls:
        - {wrong: "with the recoil", right: "in hindsight", explanation: "'Avec le recul' is not translated word for word."}
    exercises:
      gap_fill: {sentence: "___, starting with a simpler model would have saved us weeks.", answer: in hindsight}
      recognition_in_sentence:
        sentence: "In hindsight, the deadline was far too optimistic."
        meaning: looking back with what we know now
        meaning_fr: avec le recul
        distractors: [at the very beginning, in secret, according to the client]
      sentence_production: {situation: "Say what you would change about your internship project now that it is finished.", example_answer: "In hindsight, I would have asked for feedback much earlier."}
      spoken_answer: {question: "What did you learn from a project that failed?", example_answer: "In hindsight, we never checked that the data matched the real users."}
  - term: iterate on
    sheet:
      definition_simple: To improve something step by step through repeated versions.
      translation_fr: [faire évoluer par itérations]
      examples:
        - {sentence: "The team iterated on the questionnaire after each pilot round.", kind: academic}
        - {sentence: "Let's ship this version and iterate on it next week.", kind: spoken}
      pronunciation: {ipa_us: "ˈɪtəˌreɪt ɑn", stressed_syllable: "IT"}
    exercises:
      gap_fill: {sentence: "We released a first prototype so we could ___ it with user feedback.", answer: iterate on, accepted: [iterated on, iterates on]}
      recognition_in_sentence:
        sentence: "She iterated on the design until the users were happy."
        meaning: improved it through repeated versions
        meaning_fr: l'a fait évoluer par itérations
        distractors: [repeated it word for word, abandoned it, explained it once]
      sentence_production: {situation: "Explain that your dashboard improved over several versions thanks to comments.", example_answer: "I iterated on the dashboard several times using the users' comments."}
      spoken_answer: {question: "How do you work with a client who is not sure what they want?", example_answer: "I build a quick first version and iterate on it with them."}
  - term: deal-breaker
    sheet:
      definition_simple: A problem serious enough to make you reject an option.
      translation_fr: [critère rédhibitoire]
      register_level: informal
      examples:
        - {sentence: "For many hospitals, the lack of interpretability was a deal-breaker.", kind: academic}
        - {sentence: "Long training times aren't a deal-breaker for us.", kind: spoken}
      pronunciation: {ipa_us: "ˈdilˌbreɪkər", stressed_syllable: "DEAL"}
    exercises:
      gap_fill: {sentence: "The licence cost was a ___, so we picked the open-source tool.", answer: deal-breaker, accepted: [deal-breakers]}
      recognition_in_sentence:
        sentence: "A three-hour commute would be a deal-breaker for me."
        meaning: a reason strong enough to refuse
        meaning_fr: un critère rédhibitoire
        distractors: [a small advantage, a signed contract, a good bargain]
      sentence_production: {situation: "Tell a recruiter that working only in the office is not acceptable for you.", example_answer: "Working only in the office would be a deal-breaker for me."}
      spoken_answer: {question: "Is there anything that would make you turn down a job offer?", example_answer: "No remote work at all would be a deal-breaker."}
  - term: ballpark figure
    sheet:
      definition_simple: A rough number that is close enough to give an idea.
      translation_fr: [ordre de grandeur, chiffre approximatif]
      examples:
        - {sentence: "A ballpark figure for annual costs is reported in the appendix.", kind: academic}
        - {sentence: "Can you give me a ballpark figure for the budget?", kind: spoken}
      pronunciation: {ipa_us: "ˈbɔlˌpɑrk ˈfɪɡjər", stressed_syllable: "BALL"}
    exercises:
      gap_fill: {sentence: "I don't need the exact cost, just a ___.", answer: ballpark figure, accepted: [ballpark figures]}
      recognition_in_sentence:
        sentence: "His ballpark figure was ten thousand euros."
        meaning: a rough estimate
        meaning_fr: un ordre de grandeur
        distractors: [the exact final price, the price of a stadium ticket, a sports score]
      sentence_production: {situation: "Your manager asks how many hours the project will take; give a rough number.", example_answer: "As a ballpark figure, around two hundred hours."}
      spoken_answer: {question: "How much data would you need to train this model?", example_answer: "A ballpark figure would be fifty thousand labelled examples."}
  - term: trade off against
    sheet:
      definition_simple: To balance one thing against another when you cannot have both.
      translation_fr: [mettre en balance avec]
      examples:
        - {sentence: "Precision must be traded off against recall when the threshold is chosen.", kind: academic}
        - {sentence: "Here speed has to be traded off against accuracy, I think.", kind: spoken}
      pronunciation: {ipa_us: "treɪd ˈɔf əˈɡɛnst", stressed_syllable: "OFF"}
      confusables:
        - {term: trade-off, difference: "'Trade-off' is the noun; 'trade off against' is the verb."}
    exercises:
      gap_fill: {sentence: "In fraud detection, false alarms are ___ missed fraud.", answer: traded off against, accepted: [trade off against, trades off against]}
      recognition_in_sentence:
        sentence: "When choosing the survey size, cost was traded off against coverage."
        meaning: balanced one goal against another
        meaning_fr: a mis en balance
        distractors: [exchanged money for, refused to compare, added together]
      sentence_production: {situation: "Explain that your choice of model balances interpretability with accuracy.", example_answer: "Interpretability was traded off against accuracy, so we chose a small tree."}
      spoken_answer: {question: "How did you choose the decision threshold?", example_answer: "Precision was traded off against recall, based on the cost of each error."}
  - term: false negative
    sheet:
      definition_simple: A case where a test says "no" although the true answer is "yes".
      translation_fr: [faux négatif]
      register_level: academic
      examples:
        - {sentence: "In screening, a false negative can delay treatment for months.", kind: academic}
        - {sentence: "We really want to avoid a false negative on fraud cases.", kind: spoken}
      pronunciation: {ipa_us: "fɔls ˈnɛɡətɪv", stressed_syllable: "NEG"}
      confusables:
        - {term: false positive, difference: "A false positive says 'yes' when the truth is 'no'."}
    exercises:
      gap_fill: {sentence: "The model missed a sick patient: that is a ___.", answer: false negative, accepted: [false negatives]}
      recognition_in_sentence:
        sentence: "Each false negative means a fraudulent payment goes through."
        meaning: a real case the test failed to detect
        meaning_fr: un faux négatif
        distractors: [a normal case wrongly flagged, a correct detection, a missing value]
      sentence_production: {situation: "Explain why recall matters for a cancer screening model.", example_answer: "Recall matters because every false negative is a patient we fail to detect."}
      spoken_answer: {question: "Which error is worse for a spam filter, and why?", example_answer: "A false positive is usually worse, but a false negative is just an annoying email."}

  # --- Presenting results ----------------------------------------------------------------------
  - term: as you can see on this slide
    sheet:
      definition_simple: A phrase to point the audience to what is shown on the current slide.
      translation_fr: [comme vous pouvez le voir sur cette diapositive]
      register_level: spoken
      examples:
        - {sentence: "As you can see on this slide, the estimates are stable across specifications.", kind: academic}
        - {sentence: "As you can see on this slide, sales doubled in two years.", kind: spoken}
      pronunciation: {ipa_us: "æz ju kæn ˈsi ɑn ðɪs ˈslaɪd", stressed_syllable: "SLIDE"}
      french_speaker_pitfalls:
        - {wrong: "as you can see on this diapositive", right: "as you can see on this slide", explanation: "'Diapositive' is 'slide' in English."}
    exercises:
      gap_fill: {sentence: "___, the blue line is the treated group.", answer: as you can see on this slide}
      recognition_in_sentence:
        sentence: "As you can see on this slide, the error rate falls after training."
        meaning: look at what the current slide shows
        meaning_fr: comme vous le voyez sur cette diapositive
        distractors: [this slide is not important, I will show this later, please ignore the screen]
      sentence_production: {situation: "Introduce a chart showing that response rates were higher online.", example_answer: "As you can see on this slide, response rates were higher online."}
      spoken_answer: {question: "How would you introduce the main chart of your talk?", example_answer: "As you can see on this slide, the gap closes after the reform."}
  - term: to put this into perspective
    sheet:
      definition_simple: A phrase that compares a number with something familiar so people understand its size.
      translation_fr: [pour remettre cela en perspective]
      register_level: spoken
      examples:
        - {sentence: "To put this into perspective, the effect equals one extra month of schooling.", kind: academic}
        - {sentence: "To put this into perspective, it's the population of a small town.", kind: spoken}
      pronunciation: {ipa_us: "tu pʊt ðɪs ˈɪntu pərˈspɛktɪv", stressed_syllable: "SPEC"}
    exercises:
      gap_fill: {sentence: "We lost two percent of users. To ___, that's about four thousand people.", answer: put this into perspective}
      recognition_in_sentence:
        sentence: "To put this into perspective, the whole budget equals one week of advertising."
        meaning: to compare it with something familiar
        meaning_fr: pour remettre cela en perspective
        distractors: [to make it look smaller than it is, to change the topic, to end the presentation]
      sentence_production: {situation: "Your audience hears that the model saves 500 hours a year; compare it with something familiar.", example_answer: "To put this into perspective, that's three full-time months of work."}
      spoken_answer: {question: "How would you make a large number meaningful to your audience?", example_answer: "I'd say to put this into perspective and compare it with something they know."}
  - term: what stands out here is
    sheet:
      definition_simple: A phrase to point to the most noticeable result.
      translation_fr: [ce qui ressort ici, c'est]
      register_level: spoken
      examples:
        - {sentence: "In the third column, what stands out here is the persistence of the effect.", kind: academic}
        - {sentence: "What stands out here is the big jump in week three.", kind: spoken}
      pronunciation: {ipa_us: "wʌt stændz ˈaʊt hɪr ɪz", stressed_syllable: "OUT"}
    exercises:
      gap_fill: {sentence: "Look at the last column. ___ the very low score for the north.", answer: what stands out here is}
      recognition_in_sentence:
        sentence: "What stands out here is how stable the results are."
        meaning: the most noticeable point is
        meaning_fr: ce qui ressort ici, c'est
        distractors: [what is missing here is, what I disagree with is, what comes next is]
      sentence_production: {situation: "Point the audience to the surprising drop in December on your chart.", example_answer: "What stands out here is the sharp drop in December."}
      spoken_answer: {question: "How would you highlight the key result on a busy chart?", example_answer: "I'd say what stands out here is the gap between the two groups."}
  - term: moving on to
    sheet:
      definition_simple: A phrase to start the next part of a talk.
      translation_fr: [passons maintenant à]
      register_level: spoken
      examples:
        - {sentence: "Moving on to the robustness checks, the next table reports alternative specifications.", kind: academic}
        - {sentence: "Moving on to the results, let's start with the first model.", kind: spoken}
      pronunciation: {ipa_us: "ˈmuvɪŋ ɑn tu", stressed_syllable: "MOV"}
    exercises:
      gap_fill: {sentence: "That's all for the method. ___ the main findings.", answer: moving on to}
      recognition_in_sentence:
        sentence: "Moving on to the costs, the picture is less positive."
        meaning: now starting the next topic
        meaning_fr: passons maintenant à
        distractors: [going back to, finishing with, skipping]
      sentence_production: {situation: "You have finished presenting the data; introduce the part on limitations.", example_answer: "Moving on to the limitations of the study."}
      spoken_answer: {question: "How do you go from one section of a talk to the next?", example_answer: "I use a short phrase like moving on to the next part."}
  - term: I'd like to draw your attention to
    sheet:
      definition_simple: A polite phrase to ask the audience to look at or think about something.
      translation_fr: [j'aimerais attirer votre attention sur]
      register_level: spoken
      examples:
        - {sentence: "In this section, I'd like to draw your attention to a less obvious mechanism.", kind: academic}
        - {sentence: "I'd like to draw your attention to the bottom right corner.", kind: spoken}
      pronunciation: {ipa_us: "aɪd ˈlaɪk tu ˈdrɔ jʊr əˈtɛnʃən tu", stressed_syllable: "TEN"}
      french_speaker_pitfalls:
        - {wrong: "I'd like to attract your attention on", right: "I'd like to draw your attention to", explanation: "English uses 'draw' and the preposition 'to'."}
    exercises:
      gap_fill: {sentence: "Before we finish, ___ the second table.", answer: I'd like to draw your attention to}
      recognition_in_sentence:
        sentence: "I'd like to draw your attention to the sample size in each group."
        meaning: please look at or think about
        meaning_fr: j'aimerais attirer votre attention sur
        distractors: [please don't worry about, I'd like to draw a picture of, let me apologise for]
      sentence_production: {situation: "Politely ask the jury to look at a footnote that explains a data choice.", example_answer: "I'd like to draw your attention to the footnote on the data."}
      spoken_answer: {question: "How would you politely point out an important detail on a slide?", example_answer: "I'd like to draw your attention to the small numbers in the last row."}
  - term: this brings me to my next point
    sheet:
      definition_simple: A phrase that links what you just said to the next idea.
      translation_fr: [ce qui m'amène à mon point suivant]
      register_level: spoken
      examples:
        - {sentence: "The first mechanism is weak, and this brings me to my next point, the role of prices.", kind: academic}
        - {sentence: "And this brings me to my next point: the cost.", kind: spoken}
      pronunciation: {ipa_us: "ðɪs brɪŋz mi tu maɪ ˈnɛkst pɔɪnt", stressed_syllable: "NEXT"}
    exercises:
      gap_fill: {sentence: "So the model is accurate, but slow. ___: how can we speed it up?", answer: this brings me to my next point}
      recognition_in_sentence:
        sentence: "Users loved the app, and this brings me to my next point."
        meaning: this leads to the next idea
        meaning_fr: ce qui m'amène à mon point suivant
        distractors: [this is my last point, I forgot my next point, this point is not important]
      sentence_production: {situation: "Link your result on low response rates to your next idea about incentives.", example_answer: "Response rates were low, and this brings me to my next point: incentives."}
      spoken_answer: {question: "How do you connect two parts of your argument smoothly?", example_answer: "I say this brings me to my next point and then announce it."}
  - term: bear with me
    sheet:
      definition_simple: A polite way to ask people to wait or be patient for a moment.
      translation_fr: [un instant, s'il vous plaît, soyez patients]
      register_level: spoken
      examples:
        - {sentence: "Bear with me while I present the formal model, which is less intuitive.", kind: academic}
        - {sentence: "Bear with me, the video is loading.", kind: spoken}
      pronunciation: {ipa_us: "ˈbɛr wɪð mi", stressed_syllable: "BEAR"}
      confusables:
        - {term: bare with me, difference: "'Bare' means naked; the expression is always 'bear with me'."}
    exercises:
      gap_fill: {sentence: "___ for a moment while I reconnect the projector.", answer: bear with me}
      recognition_in_sentence:
        sentence: "Bear with me, this part is a bit technical."
        meaning: please be patient with me
        meaning_fr: soyez patients avec moi
        distractors: [come with me, agree with me, stop listening to me]
      sentence_production: {situation: "Your slides don't open; ask the audience to wait a little.", example_answer: "Bear with me, I'm opening the slides again."}
      spoken_answer: {question: "What do you say when your demo crashes during a talk?", example_answer: "I say bear with me and restart it calmly."}
  - term: to sum up
    sheet:
      definition_simple: A phrase that introduces a short summary.
      translation_fr: [pour résumer]
      register_level: spoken
      examples:
        - {sentence: "To sum up, the evidence points to a modest effect on enrolment.", kind: academic}
        - {sentence: "To sum up, the new process saves time and money.", kind: spoken}
      pronunciation: {ipa_us: "tu ˈsʌm ʌp", stressed_syllable: "SUM"}
      french_speaker_pitfalls:
        - {wrong: "to resume", right: "to sum up", explanation: "'Resume' means to start again, not to summarise."}
    exercises:
      gap_fill: {sentence: "To ___, our model is faster and just as accurate.", answer: sum up}
      recognition_in_sentence:
        sentence: "To sum up, we found no effect on wages."
        meaning: in summary
        meaning_fr: pour résumer
        distractors: [to start again, to add numbers, to be honest]
      sentence_production: {situation: "Close your talk by repeating your two main findings briefly.", example_answer: "To sum up, attendance rose and grades stayed the same."}
      spoken_answer: {question: "How do you start the conclusion of a presentation?", example_answer: "I usually say to sum up and give the two key results."}
  - term: the key takeaway is
    sheet:
      definition_simple: A phrase that introduces the most important message to remember.
      translation_fr: [le message principal à retenir, c'est]
      register_level: spoken
      examples:
        - {sentence: "For policy, the key takeaway is that teacher training matters more than class size.", kind: academic}
        - {sentence: "The key takeaway is that more data beat a fancier model.", kind: spoken}
      pronunciation: {ipa_us: "ðə ˈki ˈteɪkəˌweɪ ɪz", stressed_syllable: "TAKE"}
    exercises:
      gap_fill: {sentence: "If you remember one thing, ___ that cleaning the data matters most.", answer: the key takeaway is}
      recognition_in_sentence:
        sentence: "The key takeaway is that early feedback saved the project."
        meaning: the most important message is
        meaning_fr: le message principal à retenir, c'est
