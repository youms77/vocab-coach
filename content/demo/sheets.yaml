  - term: overfitting
    sheet: {translation_fr: [surapprentissage, surajustement]}
  - term: walk someone through
    sheet: {translation_fr: [expliquer pas à pas à quelqu'un]}
  - term: regularization
    sheet: {translation_fr: [régularisation]}
  - term: feature engineering
    sheet: {translation_fr: [ingénierie des variables]}
  - term: data leakage
    sheet: {translation_fr: [fuite de données]}
  - term: ground truth
    sheet: {translation_fr: [vérité terrain]}
  - term: baseline model
    sheet: {translation_fr: [modèle de référence]}
  - term: hyperparameter tuning
    sheet: {translation_fr: [réglage des hyperparamètres]}
  - term: cross-validation
    sheet: {translation_fr: [validation croisée]}
